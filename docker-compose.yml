version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: axion-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-axion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-axion123}
      POSTGRES_DB: ${DB_NAME:-axion_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: axion-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axion-backend
    restart: always
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-axion}
      DB_PASSWORD: ${DB_PASSWORD:-axion123}
      DB_NAME: ${DB_NAME:-axion_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: axion-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # Dashboard Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  db:
    image: postgres:15-alpine
    container_name: axion-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-axion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-axion123}
      POSTGRES_DB: ${DB_NAME:-axion_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: axion-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axion-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-axion}
      DB_PASSWORD: ${DB_PASSWORD:-axion123}
      DB_NAME: ${DB_NAME:-axion_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_URL: ${OLLAMA_URL}
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: axion-prometheus
    volumes:
      - ./infrastructure/monitoring:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.0.0
    container_name: axion-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.8.2
    container_name: axion-loki
    volumes:
      - ./infrastructure/monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

volumes:
  postgres_data:
